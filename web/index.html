<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinoguide Köln Bonn</title>
    <meta name="description" content="Alle Filme in Köln und Bonn – OV, OmU und deutsche Fassung, sortiert nach IMDb, Metascore und Letterboxd." />
    <meta name="theme-color" content="#0c1a2e" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <meta property="og:title" content="Kinoguide Köln Bonn" />
    <meta property="og:description" content="Alle Filme in Köln und Bonn – OV, OmU und deutsche Fassung, mit IMDb, Metascore und Letterboxd." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kinoguide.github.io/" />
  </head>
  <body>
    <div id="root"></div>
    <!-- start loading the program immediately, in parallel with the JS bundle;
         App picks up this promise instead of fetching a second time -->
    <script>
      window.__movies = fetch('data/movies.json').then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status)
        return r.json()
      })
      window.__movies.catch(function () {})
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
